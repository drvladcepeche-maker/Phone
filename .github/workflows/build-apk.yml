name: Сборка Анализ телефона 2

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-untrusted-or-manual:
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon
      - name: Build unsigned debug APK
        run: gradle assembleDebug --no-daemon
      - name: Upload debug validation APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneAnalyzer-2-debug-validation-only
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  build-trusted-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PHONE_KEYSTORE_BASE64: ${{ secrets.PHONE_KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 }}
      PHONE_KEYSTORE_PASSWORD: ${{ secrets.PHONE_KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
      PHONE_KEY_ALIAS: ${{ secrets.PHONE_KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
      PHONE_KEY_PASSWORD: ${{ secrets.PHONE_KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
      - name: Configure stable signing
        shell: bash
        run: |
          if [ -z "$PHONE_KEYSTORE_BASE64" ]; then
            echo "::error::Missing repository secret: PHONE_KEYSTORE_BASE64 or ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          for name in PHONE_KEYSTORE_PASSWORD PHONE_KEY_ALIAS PHONE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/phone-signing.p12"
          if ! printf '%s' "$PHONE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"; then
            echo "::error::Keystore secret is not valid Base64."
            exit 1
          fi
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Decoded keystore file is empty."
            exit 1
          fi
          if ! keytool -list -keystore "$KEYSTORE_PATH" -storetype PKCS12 -storepass "$PHONE_KEYSTORE_PASSWORD" -alias "$PHONE_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Keystore validation failed; diagnostic details were suppressed."
            exit 1
          fi
          {
            echo "PHONE_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "PHONE_KEYSTORE_PASSWORD=$PHONE_KEYSTORE_PASSWORD"
            echo "PHONE_KEY_ALIAS=$PHONE_KEY_ALIAS"
            echo "PHONE_KEY_PASSWORD=$PHONE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Stable Android signing is configured."
      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon
      - name: Build signed release APK
        run: gradle assembleRelease --no-daemon
      - name: Verify release APK signature
        run: "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
      - name: Rename release APK
        run: cp app/build/outputs/apk/release/app-release.apk "Анализ телефона 2-v1.3.1.apk"
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: Анализ телефона 2-v1.3.1
          path: Анализ телефона 2-v1.3.1.apk
          if-no-files-found: error
